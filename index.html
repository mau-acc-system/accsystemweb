<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            color: #172554;
        }

        .loader {
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 18px;
            border: 4px solid #dbe4f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        p {
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="loader">
        <div class="spinner"></div>
        <strong>Opening Accounting System</strong>
        <p id="status">Checking login session...</p>
    </div>

    <script>
        // SESSION CHECK
        const SESSION_KEY = "accsystem_session";

        const session = sessionStorage.getItem(SESSION_KEY);

        if (session) {

            document.getElementById("status").textContent =
                "Opening Dashboard...";

            window.location.replace("dashboard.html");

        } else {

            document.getElementById("status").textContent =
                "Redirecting to Login...";

            window.location.replace("login.html");

        }
    </script>

</body>
</html>
