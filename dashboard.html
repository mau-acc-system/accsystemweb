<main class="main">
    <header class="header">
        <div class="header-title" id="pageTitle">Dashboard</div>
        <div class="header-right">
            <div class="user-info">
                <div class="user-name" id="userName">User</div>
                <div class="user-role" id="userRole">Role</div>
            </div>
            <div class="avatar" id="userAvatar">U</div>
            <button class="logout" onclick="logout()">Logout</button>
        </div>
    </header>

    <section class="content-area">
        <iframe id="contentFrame" name="contentFrame" src="about:blank"></iframe>
    </section>
</main>

<script>
const session = JSON.parse(sessionStorage.getItem("accsystem_session") || "null");

if (!session) {
    window.location.href = "login.html";
}

const currentUser = session || {};
const userRole = currentUser.Role || "";
const userAccess = currentUser.Access || [];

document.getElementById("userName").textContent =
    currentUser.DisplayName || currentUser.Username || "User";

document.getElementById("userRole").textContent = userRole;

document.getElementById("userAvatar").textContent =
    (currentUser.DisplayName || currentUser.Username || "U")
    .trim().charAt(0).toUpperCase();

function logout() {
    sessionStorage.removeItem("accsystem_session");
    window.location.href = "login.html";
}

function toggleGroup(group) {
    const element = typeof group === "string"
        ? document.getElementById(group)
        : group;

    if (element) element.classList.toggle("open");
}

function setActive(element, title) {
    document.querySelectorAll(".task-item,.menu-item").forEach(item => {
        item.classList.remove("active");
    });

    element.classList.add("active");
    document.getElementById("pageTitle").textContent = title;
}

function openTask(element) {
    setActive(element, element.dataset.task || element.textContent.trim());

    const parentGroup = element.closest(".menu-group");
    if (parentGroup) parentGroup.classList.add("open");
}

const FAVORITES_KEY = "ACC_FAVORITES";

function getFavorites() {
    try {
        return JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");
    } catch {
        return [];
    }
}

function saveFavorites(favorites) {
    localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
}

function toggleFavorite(event, button) {
    event.preventDefault();
    event.stopPropagation();

    const link = button.closest("a");
    const favorite = {
        name: link.dataset.task,
        url: link.getAttribute("href")
    };

    let favorites = getFavorites();
    const exists = favorites.some(item => item.url === favorite.url);

    favorites = exists
        ? favorites.filter(item => item.url !== favorite.url)
        : [...favorites, favorite];

    saveFavorites(favorites);
    renderFavorites();
}

function renderFavorites() {
    const container = document.getElementById("favoritesList");
    const favorites = getFavorites();

    container.replaceChildren();

    if (!favorites.length) {
        const empty = document.createElement("div");
        empty.className = "favorite-empty";
        empty.textContent = "No favorites yet.";
        container.appendChild(empty);
    } else {
        favorites.forEach(favorite => {
            const link = document.createElement("a");
            link.className = "task-item";
            link.href = favorite.url;
            link.target = "contentFrame";

            const icon = document.createElement("span");
            icon.className = "task-icon";
            icon.textContent = "★";

            const name = document.createElement("span");
            name.textContent = favorite.name;

            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "favorite-star";
            remove.textContent = "★";
            remove.title = "Remove favorite";

            remove.addEventListener("click", event => {
                event.preventDefault();
                event.stopPropagation();
                saveFavorites(getFavorites().filter(item => item.url !== favorite.url));
                renderFavorites();
            });

            link.append(icon, name, remove);
            link.addEventListener("click", () => setActive(link, favorite.name));
            container.appendChild(link);
        });
    }

    document.querySelectorAll(".task-item[data-task]").forEach(link => {
        const button = link.querySelector(".favorite-star");
        if (!button) return;

        const isFavorite = favorites.some(
            item => item.url === link.getAttribute("href")
        );

        button.textContent = isFavorite ? "★" : "☆";
    });
}

function canView(moduleName) {
    if (userRole.toLowerCase() === "administrator") return true;

    return userAccess.some(row =>
        String(row.Module).trim() === moduleName &&
        (
            row.CanView === true ||
            String(row.CanView).toLowerCase() === "true" ||
            String(row.CanView) === "1"
        )
    );
}

document.querySelectorAll(".menu-group[data-module]").forEach(group => {
    if (!canView(group.dataset.module)) {
        group.style.display = "none";
    }
});

const dashboardLink = document.querySelector('.menu-item[href="dashboard.html"]');

dashboardLink.addEventListener("click", event => {
    event.preventDefault();
    setActive(dashboardLink, "Dashboard");
    showDashboard();
});

function showDashboard() {
    const frame = document.getElementById("contentFrame");

    frame.srcdoc = `
    <!DOCTYPE html>
    <html>
    <head>
    <meta charset="UTF-8">
    <style>
        *{box-sizing:border-box}
        body{margin:0;padding:28px;font-family:Arial,sans-serif;background:#f4f6fa;color:#202b3c}
        .welcome{margin-bottom:25px}
        h2{margin:0 0 7px;font-size:23px}
        p{margin:0;color:#8993a5;font-size:13px}
        .cards{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:17px}
        .card{background:white;border:1px solid #e8ecf2;border-radius:10px;padding:20px}
        .label{color:#8993a5;font-size:12px}
        .value{font-size:25px;font-weight:bold;margin-top:12px}
        .note{color:#9aa3b2;font-size:11px;margin-top:7px}
        .panel{margin-top:22px;background:white;border:1px solid #e8ecf2;border-radius:10px;padding:22px}
        .panel h3{margin:0 0 10px;font-size:15px}
        @media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:450px){.cards{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
        <div class="welcome">
            <h2>Welcome, ${escapeHtml(currentUser.DisplayName || currentUser.Username || "User")}!</h2>
            <p>Here's your ACC System workspace.</p>
        </div>
        <div class="cards">
            <div class="card"><div class="label">Total Cash</div><div class="value">₱0.00</div><div class="note">Cash balance</div></div>
            <div class="card"><div class="label">Accounts Receivable</div><div class="value">₱0.00</div><div class="note">Outstanding receivables</div></div>
            <div class="card"><div class="label">Accounts Payable</div><div class="value">₱0.00</div><div class="note">Outstanding payables</div></div>
            <div class="card"><div class="label">Net Income</div><div class="value">₱0.00</div><div class="note">Current period</div></div>
        </div>
        <div class="panel">
            <h3>Getting Started</h3>
            <p>Select a module or task from the sidebar to begin.</p>
        </div>
    </body>
    </html>`;
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[char]);
}

renderFavorites();
showDashboard();
</script>
</body>
</html>
